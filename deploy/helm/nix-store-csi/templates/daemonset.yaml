{{- $socketDir := printf "%s/plugins/nix-store-csi" .Values.kubeletDir }}
{{- $kubeletDir := clean .Values.kubeletDir }}
{{- /* The locality extender reads the plugins' metrics port. */}}
{{- $servesMetrics := or .Values.metrics.enabled .Values.locality.enabled }}
{{- $keys := .Values.trustedPublicKeys | join " " | trim }}
{{- range .Values.extraArgs }}
{{- if hasPrefix "--trusted-public-keys" . }}{{ $keys = . }}{{ end }}
{{- end }}
{{- if not (or $keys (has "--no-require-sigs" .Values.extraArgs)) }}
{{- fail "trustedPublicKeys is empty, so the plugin would refuse to start. Add a cache's key to trustedPublicKeys, or add --no-require-sigs to extraArgs to accept unsigned narinfos." }}
{{- end }}
{{- /*
One DaemonSet for the nodes outside every pool, and one for each pool. A node
that matches more than one pool goes to the first by name, since only one
plugin can serve a node.
*/}}
{{- $top := dict
  "name" (printf "%s-node" $.Release.Name)
  "pool" ""
  "nodeSelector" $.Values.nodeSelector
  "prefetch" $.Values.prefetch
  "prefetchConfigMap" $.Values.prefetchConfigMap
  "configMap" (printf "%s-prefetch" $.Release.Name)
  "inherits" false
  "maxStoreSize" $.Values.maxStoreSize
  "stateDir" $.Values.stateDir }}
{{- $daemonSets := list $top }}
{{- $earlier := list }}
{{- range $pool, $values := $.Values.nodePools }}
{{- $daemonSets = append $daemonSets (dict
  "name" (printf "%s-node-%s" $.Release.Name $pool)
  "pool" $pool
  "nodeSelector" (merge (dict) $values.nodeSelector $.Values.nodeSelector)
  "prefetch" ($values.prefetch | default dict)
  "prefetchConfigMap" ($values.prefetchConfigMap | default "")
  "configMap" (printf "%s-prefetch-%s" $.Release.Name $pool)
  "inherits" ($values.inheritPrefetch | default false)
  "maxStoreSize" (dig "maxStoreSize" $.Values.maxStoreSize $values)
  "stateDir" (dig "stateDir" $.Values.stateDir $values)
  "outside" $earlier) }}
{{- $earlier = append $earlier $values.nodeSelector }}
{{- end }}
{{- $_ := set $top "outside" $earlier }}
{{- range $ds := $daemonSets }}
{{- $values := ternary "" (printf "nodePools.%s." $ds.pool) (empty $ds.pool) }}
{{- $stateDir := clean $ds.stateDir }}
{{- if hasPrefix (printf "%s/" $kubeletDir) (printf "%s/" $stateDir) }}
{{- fail (printf "%sstateDir %s is in kubeletDir %s, so every start of the plugin would leave a mount of it on the node. Choose a dir outside kubeletDir." $values $stateDir $kubeletDir) }}
{{- end }}
{{- if and $ds.prefetch $ds.prefetchConfigMap }}
{{- fail (printf "%sprefetch and %sprefetchConfigMap are both set. Set only one." $values $values) }}
{{- end }}
{{- /*
The ConfigMaps of the plugin's lists. For a pool that inherits the top-level
lists, the volume projects them first, so where both have a key, the pool's
wins.
*/}}
{{- $configMaps := list }}
{{- range $source := ternary (list $top $ds) (list $ds) $ds.inherits }}
{{- if $source.prefetch }}
{{- $configMaps = append $configMaps (dict "name" $source.configMap) }}
{{- else if $source.prefetchConfigMap }}
{{- $configMaps = append $configMaps (dict "name" $source.prefetchConfigMap "optional" true) }}
{{- end }}
{{- end }}
{{- if $ds.inherits }}
{{- $pool := printf "nodePools.%s.prefetch" $ds.pool }}
{{- range $key, $_ := $ds.prefetch }}
{{- if hasKey $.Values.prefetch $key }}
{{- fail (printf "prefetch and %s both set %s, and the pool inherits prefetch. Rename one of the keys." $pool $key) }}
{{- end }}
{{- end }}
{{- /* A node reads storePaths only if no list in its prefetch dir has a key for its system. */}}
{{- $sources := dict "prefetch" $.Values.prefetch $pool $ds.prefetch }}
{{- range $name, $lists := $sources }}
{{- $other := ternary $pool "prefetch" (eq $name "prefetch") }}
{{- $systems := include "nix-store-csi.systems" $lists | splitList " " }}
{{- range $system := include "nix-store-csi.systems" (get $sources $other) | splitList " " | compact }}
{{- if and (hasKey $lists "storePaths") (not (has $system $systems)) }}
{{- fail (printf "%s has a key for %s and %s has none, so the pool's %s nodes would skip %s.storePaths. Give it a system, as in storePaths.%s.<name>." $other $system $name $system $name $system) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $ds.name }}
  labels:
    {{- include "nix-store-csi.labels" $ | nindent 4 }}
spec:
  # The pools' pods also match the selector of the DaemonSet for the nodes
  # outside the pools. That selector can't change, and a DaemonSet only adopts
  # pods that no controller owns.
  selector:
    matchLabels:
      {{- include "nix-store-csi.selectorLabels" $ | nindent 6 }}
      {{- with $ds.pool }}
      nix-store-csi/pool: {{ . }}
      {{- end }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $.Values.updateStrategy.rollingUpdate.maxUnavailable | toYaml }}
  template:
    metadata:
      # Selector labels only: helm.sh/chart changes with every chart version,
      # and in the pod template that would restart every node plugin.
      labels:
        {{- include "nix-store-csi.selectorLabels" $ | nindent 8 }}
        {{- with $ds.pool }}
        nix-store-csi/pool: {{ . }}
        {{- end }}
    spec:
      {{- include "nix-store-csi.podSpec" $ | nindent 6 }}
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $ds.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ds.outside }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- include "nix-store-csi.outside" . | nindent 14 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nix-store-csi
          {{- include "nix-store-csi.image" $ | nindent 10 }}
          args:
            - --endpoint=/csi/csi.sock
            - --state-dir={{ $stateDir }}
            {{- with $.Values.maxClosureSize }}
            - --max-closure-size={{ . }}
            {{- end }}
            {{- with $ds.maxStoreSize }}
            - --max-store-size={{ . }}
            {{- end }}
            {{- if $servesMetrics }}
            # Dual-stack, so Prometheus reaches it on IPv4 and IPv6 pod IPs.
            # The plugin binds 0.0.0.0 instead on nodes without IPv6.
            - "--metrics-address=[::]:{{ $.Values.metrics.port }}"
            {{- end }}
            {{- if $.Values.locality.enabled }}
            - --serve-paths
            {{- end }}
            {{- if $configMaps }}
            - --prefetch-dir=/etc/nix-store-csi/prefetch
            {{- end }}
            {{- with $.Values.mountpoints.paths }}
            - --mountpoints={{ join " " . }}
            {{- end }}
            {{- if $.Values.mountpoints.cdi }}
            - --host-root=/host
            {{- end }}
            {{- with $.Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- include "nix-store-csi.cacheEnv" $ | nindent 12 }}
          {{- with include "nix-store-csi.cacheEnvFrom" $ }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: healthz
              containerPort: {{ $.Values.livenessProbe.port }}
            {{- if $servesMetrics }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
            {{- end }}
          # Start-up reads every narinfo and prunes the views before the
          # plugin serves, which takes a while on a big node store.
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          # Mounting into kubelet's pod directories needs it.
          securityContext:
            privileged: true
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
            # Kubelet's target paths have to resolve to the same place here.
            # Bidirectional propagates the plugin's mounts out to the host.
            - name: kubelet
              mountPath: {{ $.Values.kubeletDir }}
              mountPropagation: Bidirectional
            - name: state
              mountPath: {{ $stateDir }}
              subPath: {{ base $stateDir }}
            {{- with include "nix-store-csi.credentialsMount" $ }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if $configMaps }}
            # Kubelet updates the files when the list changes, so the pod
            # template has no checksum of it that would restart the plugin.
            - name: prefetch
              mountPath: /etc/nix-store-csi/prefetch
              readOnly: true
            {{- end }}
            {{- if $.Values.mountpoints.cdi }}
            # The node's root, since systemd deletes /run/cdi and creates it
            # again when NixOS's generator restarts, and a mount of the dir
            # would keep the deleted one. HostToContainer makes the plugin's
            # copy follow mounts and unmounts on the node.
            - name: host
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
        - name: registrar
          image: {{ $.Values.registrar.image.repository }}:{{ $.Values.registrar.image.tag }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $socketDir }}/csi.sock
          {{- with $.Values.registrar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: registration
              mountPath: /registration
        # Serves the healthz probe above by calling the plugin's Probe RPC.
        - name: liveness-probe
          image: {{ $.Values.livenessProbe.image.repository }}:{{ $.Values.livenessProbe.image.tag }}
          args:
            - --csi-address=/csi/csi.sock
            - --health-port={{ $.Values.livenessProbe.port }}
          {{- with $.Values.livenessProbe.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          hostPath:
            path: {{ $socketDir }}
            type: DirectoryOrCreate
        - name: registration
          hostPath:
            path: {{ $.Values.kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet
          hostPath:
            path: {{ $.Values.kubeletDir }}
            type: Directory
        # The state dir's parent, which has to exist. Kubelet creates the state
        # dir in it as the subPath. For a hostPath of the state dir itself, it
        # would create missing parents too, on whatever disk holds them.
        - name: state
          hostPath:
            path: {{ dir $stateDir }}
            type: Directory
        {{- if $.Values.mountpoints.cdi }}
        - name: host
          hostPath:
            path: /
            type: Directory
        {{- end }}
        {{- with include "nix-store-csi.credentials" $ }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $configMaps }}
        # The plugin starts without an optional ConfigMap, and reads its lists
        # once it exists.
        - name: prefetch
          {{- if eq (len .) 1 }}
          configMap:
            {{- toYaml (first .) | nindent 12 }}
          {{- else }}
          projected:
            sources:
              {{- range . }}
              - configMap:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
          {{- end }}
        {{- end }}
{{- end }}

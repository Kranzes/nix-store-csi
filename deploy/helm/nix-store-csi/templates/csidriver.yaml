apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Pods refer to the driver by this name, so it doesn't follow the release
  # name.
  name: nix-store-csi
  labels:
    {{- include "nix-store-csi.labels" . | nindent 4 }}
    # Without it, OpenShift refuses the driver's inline volumes in namespaces
    # below privileged. Pods that use them can pass restricted.
    security.openshift.io/csi-ephemeral-volume-profile: restricted
spec:
  attachRequired: false
  # Keeps kubelet from chowning the read-only mount for a pod's fsGroup.
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral

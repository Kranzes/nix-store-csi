image:
  repository: ghcr.io/kranzes/nix-store-csi
  # Empty means the chart's appVersion.
  tag: ""
  # Empty means IfNotPresent for a version tag and Always for a branch tag like
  # master, since a branch tag moves.
  pullPolicy: ""

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0
  resources:
    requests:
      cpu: 10m
      memory: 20Mi

livenessProbe:
  image:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.20.0
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
  # With hostNetwork this port is on the node, so it has to be free there.
  port: 9808

# Binary caches, the same for every pod on a node.
substituters:
  - https://cache.nixos.org
# The plugin accepts only narinfos signed by one of these keys.
trustedPublicKeys:
  - cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# A Secret whose netrc key holds the caches' credentials in netrc format:
#   machine cache.example.com login user password secret
netrcSecret: ""
# Mounts a token with this audience for caches that take one, like niks3:
#   http://niks3.niks3.svc?bearer-token-file=/var/run/secrets/nix-store-csi/token
serviceAccountToken:
  audience: ""
# Refuses volumes whose closure's NARs add up to more than this, like 20G,
# where G is 1024^3 bytes. Prefetched closures don't count. Empty means no
# limit.
maxClosureSize: ""
# Store paths whose closures every node fetches and keeps, so pods that need
# them start without a fetch. The keys are those of a volume's attributes:
#   storePaths.x86_64-linux: /nix/store/<hash>-hello-2.12.3
#   storePaths.aarch64-linux: /nix/store/<hash>-hello-2.12.3
prefetch: {}
# Groups of nodes that prefetch their own lists instead of `prefetch`. A
# closure that every node needs goes in each pool's list too. Each pool gets
# its own DaemonSet on the nodes that match its nodeSelector and the top-level
# one. A node that matches more than one pool goes to the first by name.
#   gpu:
#     nodeSelector:
#       karpenter.sh/nodepool: gpu
#     prefetch:
#       storePaths.x86_64-linux: /nix/store/<hash>-trainer
nodePools: {}
# More nix-store-csi flags, like --keep-recent=7d.
extraArgs: []

# Namespaces whose pods may use the driver's volumes. Empty allows every
# namespace.
admissionPolicy:
  allowedNamespaces: []

# Prometheus metrics at /metrics on this port. With hostNetwork the port is on
# the node, so it has to be free there.
metrics:
  enabled: false
  port: 9809
  # A PodMonitor for the Prometheus Operator, whose CRDs it needs.
  podMonitor:
    enabled: false
    # Labels that the operator's Prometheus selects monitors by, like
    # kube-prometheus-stack's `release: <its release name>`.
    labels: {}
  # A PrometheusRule with alerts for the Prometheus Operator, whose CRDs it
  # needs. NixStoreCsiDown needs the PodMonitor, and with nodePools,
  # NixStoreCsiPrefetchBehind needs its pool label.
  prometheusRule:
    enabled: false
    # Labels that the operator's Prometheus selects rules by.
    labels: {}
    # Labels for every alert, like a team to route them by.
    alertLabels: {}
    alerts:
      # Prometheus can't scrape a plugin.
      NixStoreCsiDown:
        enabled: true
        for: 10m
        severity: critical
      # Publishes fail with Internal on a node.
      NixStoreCsiPublishErrors:
        enabled: true
        for: 15m
        severity: warning
      # A node skips a cache for most of 15 minutes after failed requests.
      NixStoreCsiCacheUnreachable:
        enabled: true
        for: 15m
        severity: warning
      # More than this share of the NAR fetches from a cache fail.
      NixStoreCsiNarFetchErrors:
        enabled: true
        for: 15m
        severity: warning
        ratio: 0.1
      # Fetched store objects wait for a sync while no fetch runs.
      NixStoreCsiSyncStuck:
        enabled: true
        for: 15m
        severity: warning
      # A sync of the node store failed in the last hour.
      NixStoreCsiSyncErrors:
        enabled: true
        for: 0m
        severity: critical
      # Collections of the node store fail.
      NixStoreCsiGcErrors:
        enabled: true
        for: 30m
        severity: warning
      # The node store's filesystem has less free space or inodes than
      # --ensure-free keeps, so collection deletes store paths that pods used
      # within --keep-recent.
      NixStoreCsiLowSpace:
        enabled: true
        for: 15m
        severity: warning
      # A node doesn't hold the closures of the current prefetch list. Make it
      # longer than a node takes to fetch the list.
      NixStoreCsiPrefetchBehind:
        enabled: true
        for: 30m
        severity: warning
  # A ConfigMap with the Grafana dashboard, for Grafana's dashboard sidecar.
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    # The namespace that the sidecar watches. Empty means the release's.
    namespace: ""

kubeletDir: /var/lib/kubelet
stateDir: /var/lib/nix-store-csi

# A number of nodes or a percentage, like 10%. maxSurge stays 0, since a second
# plugin pod on a node fails to start while the first holds the state dir's
# lock.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

hostNetwork: false
# system-node-critical keeps the plugin from being evicted. GKE allows that
# class only in kube-system or in a namespace with a ResourceQuota for it.
priorityClassName: ""
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
# No memory limit, since an OOM kill during a fetch is worse than overcommit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi

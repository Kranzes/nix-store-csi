image:
  repository: ghcr.io/kranzes/nix-store-csi
  # Empty means the chart's appVersion.
  tag: ""
  # Empty means IfNotPresent for a version tag and Always for a branch tag like
  # master, since a branch tag moves.
  pullPolicy: ""
# Secrets that the node plugins and the locality extender pull their images
# with.
imagePullSecrets: []

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0
  resources:
    requests:
      cpu: 10m
      memory: 20Mi

livenessProbe:
  image:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.20.0
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
  # With hostNetwork this port is on the node, so it has to be free there.
  port: 9808

# Binary caches, the same for every pod on a node.
substituters:
  - https://cache.nixos.org
# The plugin accepts only narinfos signed by one of these keys.
trustedPublicKeys:
  - cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# A Secret whose netrc key holds the caches' credentials in netrc format:
#   machine cache.example.com login user password secret
netrcSecret: ""
# A Secret whose keys the plugin gets as environment variables, for s3://
# caches that take keys, like AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
s3CredentialsSecret: ""
# Annotations for the plugin's ServiceAccount, like eks.amazonaws.com/role-arn
# for IRSA.
serviceAccount:
  annotations: {}
# Mounts a token with this audience for caches that take one, like niks3:
#   http://niks3.niks3.svc?bearer-token-file=/var/run/secrets/nix-store-csi/token
serviceAccountToken:
  audience: ""
# Refuses volumes whose closure's NARs add up to more than this, like 20G,
# where G is 1024^3 bytes. Prefetched closures don't count. Empty means no
# limit.
maxClosureSize: ""
# Refuses volumes that need a fetch if the NARs of their closure and those that
# garbage collection can't delete add up to more than this, like 200G, or a
# share of the state dir's filesystem, like 50%. Those are the closures of
# mounted volumes, of fetches under way and of prefetched store paths. Empty
# means no limit.
maxStoreSize: ""
# Store paths whose closures every node fetches and keeps, so pods that need
# them start without a fetch. The keys are those of a volume's attributes,
# and storePaths.<system>.<name> adds a list, so values files can each set
# their own. A node takes every key for its system, or if there is none,
# storePaths:
#   storePaths.x86_64-linux: /nix/store/<hash>-hello-2.12.3
#   storePaths.x86_64-linux.batch: /nix/store/<hash>-batch
#   storePaths.aarch64-linux: /nix/store/<hash>-hello-2.12.3
prefetch: {}
# A ConfigMap in the release's namespace that holds the lists in place of
# prefetch, for owners who write their keys outside Helm. The plugin starts
# without it and reads its lists once it exists. Its lists have no alert rules
# of their own.
prefetchConfigMap: ""
# Groups of nodes that prefetch their own lists, from a pool's prefetch or
# prefetchConfigMap, instead of the top-level ones. With inheritPrefetch, a
# pool's nodes read the top-level lists too, so a closure that every node needs
# goes in those once. A pool's maxStoreSize replaces the top-level one on its
# nodes, and an empty one turns the limit off there. A pool's stateDir replaces
# the top-level one too. Each pool gets its own DaemonSet on the nodes that
# match its nodeSelector and the top-level one. A node that matches more than
# one pool goes to the first by name.
#   gpu:
#     nodeSelector:
#       karpenter.sh/nodepool: gpu
#     maxStoreSize: 2T
#     stateDir: /mnt/instance-store/nix-store-csi
#     inheritPrefetch: true
#     prefetch:
#       storePaths.x86_64-linux.trainer: /nix/store/<hash>-trainer
nodePools: {}
# A container runtime cannot bind anything under /nix/store in a pod that
# mounts the driver's volume, since it cannot create the mountpoint in the
# read-only volume. These give each volume empty mountpoints there.
# docs/PODS.md has what GPU pods need.
mountpoints:
  # Paths that runtimes or hooks bind without CDI, each in a store path. A path
  # that ends in a slash gets a directory, and others an empty file:
  #   - /nix/store/<hash>-glibc-2.40-66/lib/
  paths: []
  # Adds one for each path under /nix/store that the CDI specs in the node's
  # /etc/cdi and /var/run/cdi bind, like nvidia-container-toolkit's on NixOS,
  # also to mounted volumes when the specs change. The plugin reads the specs
  # and the files they bind through the node's root directory, which this
  # mounts read-only.
  cdi: false
# More nix-store-csi flags, like --keep-recent=7d.
extraArgs: []

# Namespaces whose pods may use the driver's volumes. Empty allows every
# namespace.
admissionPolicy:
  allowedNamespaces: []

# Prometheus metrics at /metrics on this port. With hostNetwork the port is on
# the node, so it has to be free there.
metrics:
  enabled: false
  port: 9809
  # A PodMonitor for the Prometheus Operator, whose CRDs it needs.
  podMonitor:
    enabled: false
    # Labels that the operator's Prometheus selects monitors by, like
    # kube-prometheus-stack's `release: <its release name>`.
    labels: {}
  # A PrometheusRule with alerts for the Prometheus Operator, whose CRDs it
  # needs. NixStoreCsiDown and NixStoreCsiLocalityDown need the PodMonitor, and
  # with nodePools, NixStoreCsiPrefetchBehind needs its pool label.
  prometheusRule:
    enabled: false
    # Labels that the operator's Prometheus selects rules by.
    labels: {}
    # Labels for every alert, like a team to route them by.
    alertLabels: {}
    alerts:
      # Prometheus can't scrape a plugin.
      NixStoreCsiDown:
        enabled: true
        for: 10m
        severity: critical
      # Publishes fail with Internal on a node.
      NixStoreCsiPublishErrors:
        enabled: true
        for: 15m
        severity: warning
      # A node skips a cache for most of 15 minutes after failed requests.
      NixStoreCsiCacheUnreachable:
        enabled: true
        for: 15m
        severity: warning
      # More than this share of the NAR fetches from a cache fail.
      NixStoreCsiNarFetchErrors:
        enabled: true
        for: 15m
        severity: warning
        ratio: 0.1
      # Fetched store objects wait for a sync while no fetch runs.
      NixStoreCsiSyncStuck:
        enabled: true
        for: 15m
        severity: warning
      # A sync of the node store failed in the last hour.
      NixStoreCsiSyncErrors:
        enabled: true
        for: 0m
        severity: critical
      # Collections of the node store fail.
      NixStoreCsiGcErrors:
        enabled: true
        for: 30m
        severity: warning
      # The node store's filesystem has less free space or inodes than
      # --ensure-free keeps, so collection deletes store paths that pods used
      # within --keep-recent.
      NixStoreCsiLowSpace:
        enabled: true
        for: 15m
        severity: warning
      # What garbage collection can't delete is over this share of
      # --max-store-size, so publishes that need a fetch may fail.
      NixStoreCsiStoreNearLimit:
        enabled: true
        for: 15m
        severity: warning
        ratio: 0.9
      # A node doesn't hold the closure of a prefetch list as it is now. Make it
      # longer than a node takes to fetch a list.
      NixStoreCsiPrefetchBehind:
        enabled: true
        for: 30m
        severity: warning
      # Prometheus can't scrape the locality extender.
      NixStoreCsiLocalityDown:
        enabled: true
        for: 10m
        severity: warning
      # More than this share of the locality extender's reads of the node
      # plugins fail.
      NixStoreCsiLocalityScrapeErrors:
        enabled: true
        for: 15m
        severity: warning
        ratio: 0.1
      # The locality extender can't resolve closures from the caches.
      NixStoreCsiLocalityResolveErrors:
        enabled: true
        for: 15m
        severity: warning
  # A ConfigMap with the Grafana dashboard, for Grafana's dashboard sidecar.
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    # The namespace that the sidecar watches. Empty means the release's.
    namespace: ""

# A Deployment with a scheduler extender for kube-scheduler and Volcano. It
# scores nodes by the NAR size of a pod's closure that their node stores hold.
# It reads /store-paths on the node plugins' metrics port, so it turns that
# port and --serve-paths on.
locality:
  enabled: false
  # With hostNetwork the port is on the node, so it has to be free there.
  port: 8080
  # The node plugins' tolerations don't apply to the extender's pod.
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kubeletDir: /var/lib/kubelet
# The dir that holds the node store and the views of mounted volumes. It has to
# be outside kubeletDir, and its parent has to exist, since kubelet creates only
# the dir itself. docs/DEPLOY.md has what happens when a node's state dir
# changes.
stateDir: /var/lib/nix-store-csi

# A number of nodes or a percentage, like 10%. maxSurge stays 0, since a second
# plugin pod on a node fails to start while the first holds the state dir's
# lock.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

# Puts the node plugins and the locality extender on the node's network.
hostNetwork: false
# system-node-critical keeps the plugin from being evicted. GKE allows that
# class only in kube-system or in a namespace with a ResourceQuota for it.
priorityClassName: ""
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
# No memory limit. A large fetch's peak scales with the node's CPUs, which set
# the jobs and unpack threads. Measured on closures of 13.7 and 6.3 GB:
#
#   CPUs (jobs)  peak RSS
#   4 (8)        260 to 370 MiB
#   16 (32)      790 to 940 MiB
#   32 (64)      1.0 to 1.3 GiB
#   88 (64)      1.3 to 1.7 GiB
#
# Under a lower limit the kernel kills the plugin mid-fetch. Mounted volumes
# keep working, and the fetch goes on from the store paths it finished, but can
# hit the limit again.
resources:
  requests:
    # The CPU request sets the plugin's cgroup CPU weight, its share of CPU
    # time when every CPU on the node is busy. On such a node, a 12.8 GiB
    # closure fetched 4 to 6 times slower with 10m than with 100m, at 22 to 33
    # MiB/s against 126 to 137 MiB/s.
    cpu: 100m
    # A request is not a cap. A large fetch uses more on nodes with more than
    # 4 CPUs.
    memory: 512Mi

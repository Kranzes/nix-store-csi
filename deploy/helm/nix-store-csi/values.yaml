image:
  repository: ghcr.io/kranzes/nix-store-csi
  # Defaults to the chart's appVersion.
  tag: ""

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0

# Binary caches every pod on a node shares.
substituters:
  - https://cache.nixos.org
# Keys that narinfos must be signed by.
trustedPublicKeys:
  - cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# More nix-store-csi options, like --gc-after=7d.
extraArgs: []

kubeletDir: /var/lib/kubelet
stateDir: /var/lib/nix-store-csi

hostNetwork: false
priorityClassName: system-node-critical
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
resources: {}

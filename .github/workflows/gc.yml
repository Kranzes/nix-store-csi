# Garbage collection for the hestia binary cache and GHCR.

name: GC

concurrency:
  group: gc
  cancel-in-progress: false

on:
  schedule:
    # Daily, off-peak (UTC).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hestia:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - name: Run garbage collection
        run: $HESTIA_BIN gc
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Each push to master leaves the previous master image and chart untagged.
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: nix-store-csi,nix-store-csi-runner,charts/nix-store-csi
          delete-untagged: true
          # Leaves alone what a publish may still be pushing.
          older-than: 1 day
          validate: true

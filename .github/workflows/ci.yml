name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Unlike the default, this runs steps with pipefail.
defaults:
  run:
    shell: bash

jobs:
  eval:
    runs-on: ubuntu-latest
    outputs:
      derivations: ${{ steps.eval.outputs.derivations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - id: eval
        name: Run nix-eval-jobs
        run: |
          echo "derivations=$(
            nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
              --flake . --force-recurse --check-cache-status --select '
                outputs: {
                  # default is nix-store-csi again.
                  packages = builtins.mapAttrs (_: ps: removeAttrs ps [ "default" ]) outputs.packages;
                  checks = outputs.checks // {
                    # The arm runners have no KVM for the VM test.
                    aarch64-linux = removeAttrs outputs.checks.aarch64-linux [ "nixos-test" ];
                  };
                }' \
              | jq -cs 'map({attr, system, isCached})'
          )" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    runs-on: ${{ matrix.derivation.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    name: build (${{ matrix.derivation.attr }})
    strategy:
      fail-fast: false
      matrix:
        derivation: ${{ fromJson(needs.eval.outputs.derivations) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.derivation.isCached }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        if: ${{ !matrix.derivation.isCached }}
        with:
          installer-version: 2.35.2
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        if: ${{ !matrix.derivation.isCached }}
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - run: nix build '.#${{ matrix.derivation.attr }}' -L
        if: ${{ !matrix.derivation.isCached }}

  result:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "${{ needs.build.result }}" == "success" ]]'

  # Branches publish under their name, and v* tags under their version.
  version:
    needs: result
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      chart: ${{ steps.version.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
      - id: version
        run: |
          version=$(nix eval --raw .#packages.x86_64-linux.default.version)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "The tag $GITHUB_REF_NAME doesn't match version $version." >&2
              exit 1
            fi
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "chart=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "chart=$version-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  publish-image:
    needs: version
    runs-on: ubuntu-latest
    name: publish (${{ matrix.image }})
    permissions:
      contents: read
      packages: write
      # For keyless signing.
      id-token: write
    strategy:
      matrix:
        image: [csi-image, runner-image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          regctl() { nix shell --inputs-from . nixpkgs#regclient -c regctl "$@"; }
          name=$(nix eval --raw ".#packages.x86_64-linux.$IMAGE.imageName")
          refs=()
          # The build jobs cached both, so the aarch64 one is only fetched.
          for system in x86_64-linux aarch64-linux; do
            regctl image import "ocidir://images:$system" \
              "$(nix build --print-out-paths ".#packages.$system.$IMAGE")"
            refs+=(--ref "ocidir://images:$system")
          done
          regctl index create ocidir://images:index "${refs[@]}"
          regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin <<< "$GITHUB_TOKEN"
          regctl image copy ocidir://images:index "ghcr.io/kranzes/$name:$TAG"
          cosign() { nix shell --inputs-from . nixpkgs#cosign -c cosign "$@"; }
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          cosign sign --yes "ghcr.io/kranzes/$name@$(regctl image digest "ghcr.io/kranzes/$name:$TAG")"

  publish-chart:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          CHART: ${{ needs.version.outputs.chart }}
        run: |
          helm() { nix run --inputs-from . nixpkgs#kubernetes-helm -- "$@"; }
          helm package deploy/helm/nix-store-csi --version "$CHART" --app-version "$TAG"
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          digest=$(helm push "nix-store-csi-$CHART.tgz" oci://ghcr.io/kranzes/charts 2>&1 | sed -n 's/^Digest: //p')
          cosign() { nix shell --inputs-from . nixpkgs#cosign -c cosign "$@"; }
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          cosign sign --yes "ghcr.io/kranzes/charts/nix-store-csi@$digest"
